name: JPET Lean Response-Interaction
on:
  pull_request:
    paths:
      - 'submission/JPET/formal/**'
      - '.github/workflows/jpet-lean-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-prop8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact pinned toolchain and mathlib manifest
        run: |
          test "$(cat formal/lean-toolchain)" = "leanprover/lean4:v4.32.1"
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('formal/lake-manifest.json').read_text())
          p={x['name']:x for x in j['packages']}
          assert p['mathlib']['rev'] == '520045ab14e26149ee970e2e617ca04b09bde5d6'
          PY
      - name: No proof placeholders, new axioms or native_decide
        run: |
          if grep -n -E '(^|[^A-Za-z])(sorry|admit|axiom|native_decide)([^A-Za-z]|$)' submission/JPET/formal/ResponseInteraction.lean | grep -v '^[0-9]*:.*No sorry, admit, axiom, or native_decide'; then
            echo "Forbidden trust shortcut"; exit 1
          fi
      - name: Install elan/Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathlib build artifacts
        run: |
          cd formal
          lake exe cache get
      - name: Compile added JPET Lean proofs
        run: |
          cd formal
          lake env lean ../submission/JPET/formal/ResponseInteraction.lean
      - name: Check symbolic counterpart in Python
        run: |
          python -m pip install sympy
          python submission/JPET/review_cycles/restricted_games_exact.py
