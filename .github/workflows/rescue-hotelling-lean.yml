name: rescue-hotelling-lean-verification
on:
  push:
    branches:
      - rescue-hotelling-lean-audit-2026-11-10
    paths:
      - 'formal/RescueHotellingCore.lean'
      - '.github/workflows/rescue-hotelling-lean.yml'
  workflow_dispatch:
jobs:
  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the pinned Lean/mathlib toolchain
        run: |
          test "$(cat formal/lean-toolchain)" = 'leanprover/lean4:v4.32.1'
          test -s formal/lake-manifest.json
      - name: Reject proof placeholders and project axioms
        run: |
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' formal/RescueHotellingCore.lean; then exit 1; fi
          if grep -nE '^[[:space:]]*axiom[[:space:]]' formal/RescueHotellingCore.lean; then exit 1; fi
      - name: Install pinned Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore mathlib cache
        working-directory: formal
        run: lake exe cache get
      - name: Typecheck kernel proofs and audit axioms
        working-directory: formal
        shell: bash
        run: |
          set -o pipefail
          lake env lean RescueHotellingCore.lean 2>&1 | tee RESCUE_HOTELLING_LEAN_LOG.txt
          ! grep -q 'sorryAx' RESCUE_HOTELLING_LEAN_LOG.txt
      - name: Store CI provenance
        if: always()
        run: |
          {
            echo "commit=$GITHUB_SHA"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "lean=$(cat formal/lean-toolchain)"
            echo 'scope=conditional algebraic core, not full extensive-form SPNE'
          } > formal/RESCUE_HOTELLING_PROVENANCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-hotelling-lean-log
          path: |
            formal/RESCUE_HOTELLING_LEAN_LOG.txt
            formal/RESCUE_HOTELLING_PROVENANCE.txt
          if-no-files-found: ignore
          retention-days: 30
