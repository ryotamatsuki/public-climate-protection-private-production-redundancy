name: rescue-hotelling-model-extended-audit
on:
  push:
    branches:
      - hotelling-full-formal-verification-2026-11-14
    paths:
      - 'formal/RescueHotellingModelCheck.lean'
      - 'formal/RescueHotellingExtendedGame.lean'
      - 'formal/RescueHotellingLocation.lean'
      - 'formal/RescueHotellingRefusal.lean'
      - 'formal/RescueHotellingCrossing.lean'
      - 'formal/RescueHotellingReducedNash.lean'
      - 'formal/RescueHotellingCoverage.lean'
      - 'formal/RescueHotellingBargaining.lean'
      - 'formal/RescueHotellingNoContractGlobal.lean'
      - 'formal/RescueHotellingDelivery.lean'
      - 'formal/RescueHotellingHistories.lean'
      - 'formal/RescueHotellingValue.lean'
      - 'formal/RescueHotellingWelfareGlobal.lean'
      - '.github/workflows/rescue-hotelling-model-audit.yml'
  workflow_dispatch:
jobs:
  lean-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned Lean and mathlib
        run: |
          test "$(cat formal/lean-toolchain)" = 'leanprover/lean4:v4.32.1'
          test -s formal/lake-manifest.json
      - name: Check no proof holes and custom axioms
        run: |
          for f in formal/RescueHotellingCore.lean formal/RescueHotellingModelCheck.lean formal/RescueHotellingExtendedGame.lean formal/RescueHotellingLocation.lean formal/RescueHotellingRefusal.lean formal/RescueHotellingCrossing.lean formal/RescueHotellingReducedNash.lean formal/RescueHotellingCoverage.lean formal/RescueHotellingBargaining.lean formal/RescueHotellingNoContractGlobal.lean formal/RescueHotellingDelivery.lean formal/RescueHotellingHistories.lean formal/RescueHotellingValue.lean formal/RescueHotellingWelfareGlobal.lean; do
            if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"; then exit 1; fi
            if grep -nE '^[[:space:]]*axiom[[:space:]]' "$f"; then exit 1; fi
          done
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore mathlib cache
        working-directory: formal
        run: lake exe cache get
      - name: Kernel-check original and extended proof modules
        working-directory: formal
        shell: bash
        run: |
          set -o pipefail
          lake env lean -o RescueHotellingCore.olean RescueHotellingCore.lean 2>&1 | tee CORE_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o RescueHotellingModelCheck.olean RescueHotellingModelCheck.lean 2>&1 | tee EXTENDED_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o RescueHotellingExtendedGame.olean RescueHotellingExtendedGame.lean 2>&1 | tee GAME_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o RescueHotellingLocation.olean RescueHotellingLocation.lean 2>&1 | tee LOCATION_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o RescueHotellingRefusal.olean RescueHotellingRefusal.lean 2>&1 | tee REFUSAL_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o RescueHotellingCrossing.olean RescueHotellingCrossing.lean 2>&1 | tee CROSSING_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean RescueHotellingReducedNash.lean 2>&1 | tee NASH_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean RescueHotellingCoverage.lean 2>&1 | tee COVERAGE_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean RescueHotellingBargaining.lean 2>&1 | tee BARGAINING_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean RescueHotellingNoContractGlobal.lean 2>&1 | tee NOCONTRACT_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean -o RescueHotellingDelivery.olean RescueHotellingDelivery.lean 2>&1 | tee DELIVERY_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean RescueHotellingHistories.lean 2>&1 | tee HISTORIES_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean RescueHotellingValue.lean 2>&1 | tee VALUE_LOG.txt
          LEAN_PATH=".:$LEAN_PATH" lake env lean RescueHotellingWelfareGlobal.lean 2>&1 | tee WELFARE_LOG.txt
          ! grep -q 'sorryAx' EXTENDED_LOG.txt
          ! grep -q 'sorryAx' GAME_LOG.txt
          ! grep -q 'sorryAx' LOCATION_LOG.txt
          ! grep -q 'sorryAx' REFUSAL_LOG.txt
          ! grep -q 'sorryAx' CROSSING_LOG.txt
          ! grep -q 'sorryAx' NASH_LOG.txt
          ! grep -q 'sorryAx' COVERAGE_LOG.txt
          ! grep -q 'sorryAx' BARGAINING_LOG.txt
          ! grep -q 'sorryAx' NOCONTRACT_LOG.txt
          ! grep -q 'sorryAx' DELIVERY_LOG.txt
          ! grep -q 'sorryAx' HISTORIES_LOG.txt
          ! grep -q 'sorryAx' VALUE_LOG.txt
          ! grep -q 'sorryAx' WELFARE_LOG.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-hotelling-model-audit-lean-log
          path: |
            formal/CORE_LOG.txt
            formal/EXTENDED_LOG.txt
            formal/GAME_LOG.txt
            formal/LOCATION_LOG.txt
            formal/REFUSAL_LOG.txt
            formal/CROSSING_LOG.txt
            formal/NASH_LOG.txt
            formal/COVERAGE_LOG.txt
            formal/BARGAINING_LOG.txt
            formal/NOCONTRACT_LOG.txt
            formal/DELIVERY_LOG.txt
            formal/HISTORIES_LOG.txt
            formal/VALUE_LOG.txt
            formal/WELFARE_LOG.txt
          if-no-files-found: ignore
          retention-days: 30
